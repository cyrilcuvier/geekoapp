# Values for dp.apps.rancher.io/charts/redis:2.7.2.
# Reference only: the credential value remains out of Git and is managed in the
# target namespace as a kubernetes.io/dockerconfigjson Secret.
global:
  imagePullSecrets:
    - name: application-collection

auth:
  enabled: false

# The Docker Hub baseline is ephemeral too. Disabling the PVC keeps repeated
# demo cycles independent from the cluster's storage class and cleanup policy.
persistence:
  enabled: false
